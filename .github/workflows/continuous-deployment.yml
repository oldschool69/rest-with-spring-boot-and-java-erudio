name: Continuous Integration and Delivery with Github actions

on:
  push:
    branches:
      - "gcp-deploy-kubernetes"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Login to Google Cloud Platform
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Google Cloud SDK Repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor > /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list > /dev/null
          sudo apt-get update

      - name: Install GKE Cloud Auth Plugin
        run: sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      - name: Configure GKE Cloud Auth Plugin
        run: echo "export USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Configure GKE Cluster Access
        run: gcloud container clusters get-credentials carecao-cluster --region us-central1 --project ${{ secrets.PROJECT_ID}}

      - name: Configure Docker Authentication for Google Cloud Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Set environment variables
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_URL=${{ secrets.CLOUD_SQL_URL }}" >> $GITHUB_ENV
          echo "EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}" >> $GITHUB_ENV
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> $GITHUB_ENV


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build Application JAR
        run: mvn clean package

      - name: Docker Composer Build
        run: docker compose build

      - name: Push to Google Cloud Artifact Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:latest ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:latest ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:${{ github.run_id }}

          docker push ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:latest
          docker push ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:${{ github.run_id }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/rest-with-spring-boot rest-with-spring-boot=${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:${{ github.run_id }}
          kubectl rollout status deployment rest-with-spring-boot

        #      - name: Deploy to Google Cloud Run
#        run: |
#          gcloud run deploy rest-with-spring-boot \
#            --image ${{ secrets.REGISTRY_INFO }}/rest-with-spring-boot:latest \
#            --region us-central1 \
#            --platform managed \
#            --allow-unauthenticated

      - name: Push to Docker Container Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:latest ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:${{ github.run_id }}

          docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot:${{ github.run_id }}
